pre-commit:
  parallel: true
  commands:
    # 1. Format code automatically
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}

    # 2. Fast static analysis/linting
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run {staged_files}

    # 3. Ensure the project builds cleanly
    go-build:
      run: go build ./...

    # 4. Run tests
    go-test:
      run: go test -v ./...
