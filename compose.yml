x-go-service-env: &go-service-env
  - SERVER_ADDRESS
  - DATABASE_URL
  - UPTRACE_DSN
  - KAFKA_BROKERS
  - KAFKA_TOPIC
  - KAFKA_CONSUMER_GROUP
  - OUTBOX_BATCH_SIZE
  - OUTBOX_CLAIM_TTL

x-postgres-migrations-env: &postgres-migrations-env
  - GOOSE_DRIVER
  - GOOSE_DBSTRING
  - GOOSE_MIGRATION_DIR
  - GOOSE_TABLE

x-postgres-env: &postgres-env
  - POSTGRES_DB
  - POSTGRES_USER
  - POSTGRES_PASSWORD

x-base-service: &base-service
  networks:
    - default

x-go-service: &go-service
  <<: *base-service
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    postgres_migrations:
      condition: service_completed_successfully
  environment: *go-service-env
  volumes:
    - .:/app

x-postgres-service: &postgres-service
  <<: *base-service
  image: postgres:18.4-alpine
  ports:
    - "5432:5432"
  environment: *postgres-env
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 3s
    retries: 10

services:
  api:
    <<: *go-service
    command: ["go", "run", "./cmd/api"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_migrations:
        condition: service_completed_successfully
      uptrace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

  outbox_event_publisher:
    <<: *go-service
    command: ["go", "run", "./cmd/outbox-event-publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka_topics:
        condition: service_completed_successfully
      uptrace:
        condition: service_healthy

  # Enable once cmd/outbox-event-consumer has an implementation. It will need
  # the same depends_on block as outbox_event_publisher, restated in full.
  # outbox_event_consumer:
  #   <<: *go-service
  #   command: ["go", "run", "./cmd/outbox-event-consumer"]

  postgres_migrations:
    <<: *go-service
    command: ["go", "tool", "goose", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *postgres-migrations-env
    volumes:
      - ./migrations:/app/migrations

  postgres:
    <<: *postgres-service
    volumes:
      - postgres_data:/var/lib/postgresql

  # Single-node KRaft broker, reachable only inside the Compose network.
  kafka:
    <<: *base-service
    image: apache/kafka:4.3.1
    environment:
      # Pinned so a rebuilt image cannot orphan the kafka_data volume.
      CLUSTER_ID: 0DPxTQhKQemkY6QPeHeaNw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Image default is /tmp, which would not survive on the volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created by kafka_topics, so a wrong topic name must fail.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Internal topics default to 3 replicas, which one broker cannot satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # One-shot topic creation. The image entrypoint reads arguments as env
  # overrides, so the entrypoint is replaced rather than only the command.
  kafka_topics:
    <<: *base-service
    image: apache/kafka:4.3.1
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-order.created}
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy

  kafka_ui:
    <<: *base-service
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # The cluster list stays defined here; the UI cannot add or edit clusters.
      # KAFKA_CLUSTERS_0_READONLY is left unset, so topics and messages can
      # still be written from the UI.
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    <<: *base-service
    image: clickhouse/clickhouse-server:26.3
    restart: on-failure
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_PASSWORD: uptrace
      CLICKHOUSE_DB: uptrace
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:8123/ping']
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - ch_data:/var/lib/clickhouse

  uptrace_postgres:
    <<: *base-service
    image: postgres:17-alpine
    restart: on-failure
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: uptrace
      POSTGRES_PASSWORD: uptrace
      POSTGRES_DB: uptrace
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uptrace -d uptrace']
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - uptrace_pg_data:/var/lib/postgresql/data/pgdata

  redis:
    <<: *base-service
    image: redis:6.2.2-alpine
    restart: on-failure
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
      retries: 30

  uptrace:
    <<: *base-service
    image: 'uptrace/uptrace:2.1.0-beta.5'
    restart: on-failure
    volumes:
      - ./infra/uptrace/uptrace.yml:/etc/uptrace/config.yml
    ports:
      - '14317:4317'
      - '14318:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      clickhouse:
        condition: service_healthy
      uptrace_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  otelcol:
    <<: *base-service
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: on-failure
    volumes:
      - ./infra/uptrace/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - '4317:4317'
      - '4318:4318'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - uptrace

volumes:
  postgres_data:
  kafka_data:
  ch_data:
  uptrace_pg_data:

networks:
  default:
